<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Status Page</title>
</head>
<body>
    <h1>Matching Status Page</h1>
    <div>
        <input type="text" id="name" placeholder="Enter your name">
        <button id="add-user">Add</button>
    </div>
    <div id="user-list"></div>

    <!-- Add Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js"></script>

    <script>
        // Your Firebase configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAUlLXs0QE-BdWsLP8svTXdATifO3vPTwE",
            authDomain: "aa-matching-status.firebaseapp.com",
            databaseURL: "https://aa-matching-status-default-rtdb.europe-west1.firebasedatabase.app/",
            projectId: "aa-matching-status",
            storageBucket: "aa-matching-status.appspot.com",
            messagingSenderId: "1091110952452",
            appId: "1:1091110952452:web:cbeb8b07369d0f137c5f51"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Add user to database
        document.getElementById('add-user').addEventListener('click', () => {
            const name = document.getElementById('name').value.trim();
            if (!name) {
                alert('Please enter a valid name.');
                return;
            }
            db.ref('users').push({ name: name, status: 'Not Matching' });
            document.getElementById('name').value = '';
        });

        // Listen for updates from Firebase
        db.ref('users').on('value', (snapshot) => {
            const users = snapshot.val();
            const userList = document.getElementById('user-list');
            userList.innerHTML = '';
            for (const id in users) {
                const user = users[id];
                const div = document.createElement('div');
                div.textContent = `${user.name} - ${user.status}`;
                userList.appendChild(div);
            }
        });
    </script>
</body>
</html>
