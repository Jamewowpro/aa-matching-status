<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Matching Status Page</title>
    <style>
        /* Add your styles here */
    </style>
</head>
<body>
    <h1>Matching Status Page</h1>
    <div>
        <input type="text" id="name" placeholder="Enter your name" />
        <button id="add-user">Add</button>
    </div>
    <div id="user-list">
        <!-- Users will appear here -->
    </div>

    <!-- Add Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/11.1.0/firebase-database.js"></script>

    <script>
        // Your Firebase configuration object
        const firebaseConfig = {
            apiKey: "AIzaSyAUlLXs0QE-BdWsLP8svTXdATifO3vPTwE",
            authDomain: "aa-matching-status.firebaseapp.com",
            databaseURL: "https://aa-matching-status-default-rtdb.firebaseio.com",
            projectId: "aa-matching-status",
            storageBucket: "aa-matching-status.appspot.com",
            messagingSenderId: "1091110952452",
            appId: "1:1091110952452:web:cbeb8b07369d0f137c5f51"
        };

        // Initialize Firebase
        const app = firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Example: Adding functionality for user list
        const addUserButton = document.getElementById('add-user');
        const nameInput = document.getElementById('name');
        const userList = document.getElementById('user-list');

        // Listen for changes in the database
        db.ref('users').on('value', (snapshot) => {
            const users = snapshot.val();
            userList.innerHTML = '';

            for (const id in users) {
                const user = users[id];
                const userDiv = document.createElement('div');
                userDiv.textContent = `${user.name} - ${user.status}`;
                userList.appendChild(userDiv);
            }
        });

        // Add user to the database
        addUserButton.addEventListener('click', () => {
            const name = nameInput.value.trim();
            if (!name) return alert('Enter a valid name.');

            const userRef = db.ref('users').push();
            userRef.set({
                name: name,
                status: 'Not Matching'
            });

            nameInput.value = '';
        });
    </script>
</body>
</html>
